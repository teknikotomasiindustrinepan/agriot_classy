<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node-RED Dashboard - Raw Data</title>
    <!-- Library MQTT.js -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
        }

        .container {
            width: 100%;
            max-width: 400px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 4px;
            text-align: left;
            color: #333;
        }

        .subtitle {
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
            text-align: left;
        }

        .text-display {
            font-size: 24px;
            font-weight: 600;
            color: #2d3436;
            padding: 40px 20px;
            background: #f8f9fa;
            border-radius: 12px;
            min-height: 40px;
            word-wrap: break-word;
            border: 2px solid #dee2e6;
            transition: all 0.3s ease;
            font-family: 'Courier New', Courier, monospace;
        }

        .status-info {
            font-size: 11px;
            color: #999;
            margin-top: 15px;
            text-align: right;
            font-style: italic;
        }

        .alert-box {
            background: #fff4e5;
            color: #664d03;
            padding: 12px;
            border-radius: 10px;
            font-size: 12px;
            margin-bottom: 20px;
            border: 1px solid #ffecb5;
            text-align: left;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="title">Raw MQTT Data</div>
            <div class="subtitle">Topik: lampu/kita/satu/hati</div>

            <!-- Pesan edukasi koneksi -->
            <div id="canvasAlert" class="alert-box">
                <strong>💡 Info Koneksi</strong><br>
                Dashboard ini akan menampilkan teks asli dari Node-RED. Jalankan secara lokal untuk koneksi real-time.
            </div>

            <!-- Area Display -->
            <div class="text-display" id="textData">
                Menunggu...
            </div>
            
            <div class="status-info" id="statusInfo">
                Status: Menghubungkan...
            </div>
        </div>
    </div>

    <script>
        const display = document.getElementById("textData");
        const statusInfo = document.getElementById("statusInfo");

        /**
         * FUNGSI UPDATE UI
         * Menampilkan data mentah tanpa modifikasi
         */
        function updateUI(payload) {
            // Menampilkan payload persis seperti aslinya
            display.innerHTML = payload;
            statusInfo.innerHTML = "Update terakhir: " + new Date().toLocaleTimeString('id-ID');
        }

        /**
         * LOGIKA MQTT
         * Akan bekerja jika file dibuka secara lokal (.html)
         */
        try {
            const broker = 'wss://broker.hivemq.com:8000/mqtt';
            const topic = 'lampu/kita/satu/hati';

            const client = mqtt.connect(broker, {
                clientId: 'client_raw_' + Math.random().toString(16).substring(2, 10),
                connectTimeout: 4000
            });

            client.on('connect', () => {
                document.getElementById('canvasAlert').style.display = 'none';
                statusInfo.innerHTML = "Status: Terhubung ke Broker";
                client.subscribe(topic);
            });

            client.on('message', (t, message) => {
                // Langsung kirim pesan ke UI tanpa proses apapun
                updateUI(message.toString());
            });

            client.on('error', (err) => {
                console.warn("MQTT Blocked in Preview");
            });

        } catch (e) {
            console.log("MQTT skipped in sandbox.");
        }
    </script>

</body>
</html>
