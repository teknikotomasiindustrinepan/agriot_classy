<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node-RED MQTT Text</title>

    <!-- MQTT WebSocket -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e1e2f 0%, #11111d 100%);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(74, 144, 226, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .title {
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #4a90e2;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(74, 144, 226, 0.3);
        }

        .subtitle {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 25px;
            color: #ffffff;
        }

        .text-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 25px;
            border-radius: 16px;
            font-size: 24px;
            font-weight: 600;
            color: #00ffcc;
            min-height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            border: 1px solid rgba(0, 255, 204, 0.2);
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
            word-break: break-all;
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #ff4757;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            box-shadow: 0 0 8px #ff4757;
        }

        .status-dot.connected {
            background: #2ed573;
            box-shadow: 0 0 8px #2ed573;
        }

        .footer {
            margin-top: 20px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            text-align: center;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="title">
                <span id="dot" class="status-dot"></span> 
                Live Monitor
            </div>
            <div class="subtitle">MQTT Terminal</div>

            <div class="text-box" id="dataText">
                Connecting...
            </div>

            <div class="footer" id="topicName">TOPIC: lampu/kita/satu/hati</div>
        </div>
    </div>

    <script>
        // =========================
        // MQTT CONFIG
        // =========================
        const broker = "wss://broker.hivemq.com:8884/mqtt";
        const topic = "lampu/kita/satu/hati";

        // =========================
        // CONNECT MQTT
        // =========================
        const client = mqtt.connect(broker);
        const dot = document.getElementById("dot");
        const dataBox = document.getElementById("dataText");

        client.on("connect", function () {
            console.log("MQTT Connected");
            dot.classList.add("connected");
            dataBox.innerHTML = "Waiting for data...";
            dataBox.style.color = "#ffffff";

            client.subscribe(topic, function (err) {
                if(!err){
                    console.log("Subscribe Success");
                }
            });
        });

        client.on("offline", function() {
            dot.classList.remove("connected");
            dataBox.innerHTML = "Offline";
            dataBox.style.color = "#ff4757";
        });

        // =========================
        // RECEIVE MESSAGE
        // =========================
        client.on("message", function (topic, message) {
            const payload = message.toString();
            dataBox.innerHTML = payload;
            
            // Efek kilatan saat data masuk
            dataBox.style.transform = "scale(1.05)";
            setTimeout(() => {
                dataBox.style.transform = "scale(1)";
            }, 100);

            // Jika payload adalah on/off, berikan warna khusus agar lebih keren
            if(payload.toLowerCase() === 'on') {
                dataBox.style.color = "#00ffcc";
            } else if(payload.toLowerCase() === 'off') {
                dataBox.style.color = "#ff4757";
            } else {
                dataBox.style.color = "#ffffff";
            }
        });
    </script>

</body>
</html>
